<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ボウリング料金・プラン提案システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap">
<style>
/* Layout: 受付カウンター用の2カラム。左＝条件入力、右＝提案と比較。狭い画面では縦に積む */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#1B2230; --muted:#5A6373; --line:#D3D9E0;
  --accent:#B4232A; --accent-soft:#F8E4E4; --accent-ink:#FFFFFF;
  --ok:#1D7448; --ok-bg:#E2F1E8; --warn:#8E5300; --warn-bg:#FBEED6; --no:#6B7280;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#1A2029; --sunk:#151A22; --ink:#E6EAF0; --muted:#9AA4B3; --line:#2D3542;
  --accent:#E8646A; --accent-soft:#3A1E21; --accent-ink:#1A0C0D;
  --ok:#62C893; --ok-bg:#16301F; --warn:#E9B661; --warn-bg:#36290F; --no:#8B93A1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#1A2029; --sunk:#151A22; --ink:#E6EAF0; --muted:#9AA4B3; --line:#2D3542;
  --accent:#E8646A; --accent-soft:#3A1E21; --accent-ink:#1A0C0D;
  --ok:#62C893; --ok-bg:#16301F; --warn:#E9B661; --warn-bg:#36290F; --no:#8B93A1; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding:0 16px;padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,3.2vw,28px);line-height:1.25;margin:0;text-wrap:balance;display:flex;align-items:center;gap:12px}
.pins{display:inline-grid;grid-template-columns:repeat(7,5px);gap:2px 1px;flex:none}
.pins i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.pins i.o{background:transparent}
.tag{font-size:12px;color:var(--muted);letter-spacing:.04em}
.tag b{color:var(--accent);font-weight:700}
.main{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:18px;min-width:0}
.panel h2{font-size:13px;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
fieldset{border:0;margin:0;padding:0;display:grid;gap:10px;min-width:0}
legend{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:0;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field>label,.lab{font-size:13px;font-weight:700}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.chip.soon{border-style:dashed;color:var(--accent)}
input[type=date],input[type=time],select{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--ink);width:100%;min-width:0}
.step{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk)}
.step button{font:inherit;font-size:18px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.step button:hover{background:var(--accent-soft);color:var(--accent)}
.step input{font:inherit;font-size:17px;font-weight:700;text-align:center;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0;padding:6px 0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.daybox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.linkbtn{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:2px 8px;cursor:pointer;justify-self:start}
.linkbtn:hover{border-color:var(--accent);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.results{display:grid;gap:16px;min-width:0}
.rec{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:20px;display:grid;gap:12px}
.rec .eyebrow{font-size:12px;letter-spacing:.08em;font-weight:700;color:var(--ok)}
.rec .name{font-size:18px;font-weight:700}
.rec .price{font-family:var(--f-display);font-size:clamp(34px,6vw,48px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.rec .price small{font-family:var(--f-body);font-size:14px;font-weight:700;margin-left:6px;color:var(--muted)}
.rec .per{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.callout{border-radius:var(--r);padding:14px 16px;background:var(--warn-bg);color:var(--ink);display:grid;gap:6px;border-left:4px solid var(--warn)}
.callout b.t{color:var(--warn)}
.bd{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.bd td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.bd td.d{color:var(--muted);font-size:13px;padding-left:10px}
.bd td.a{text-align:right;white-space:nowrap;padding-left:10px;font-weight:700}
.bd tr.minus td.a{color:var(--ok)}
.bd tr.sum td{border-bottom:0;border-top:2px solid var(--ink);font-weight:700;padding-top:8px}
.tbl{overflow-x:auto}
.list{margin:0;padding-left:1.2em;display:grid;gap:3px;font-size:13px}
.list.checks li::marker{color:var(--warn)}
.list.checks{color:var(--ink)}
.notes{color:var(--muted)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;min-width:0}
.sec h3{margin:0;font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec h3 span{font-weight:400;color:var(--muted);font-size:12px}
.cands{display:grid;gap:0}
details.cand{border-top:1px solid var(--line)}
details.cand:first-child{border-top:0}
details.cand summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 2px;cursor:pointer}
details.cand summary::-webkit-details-marker{display:none}
details.cand summary:hover .cname{color:var(--accent)}
.cname{font-weight:700;font-size:14px;min-width:0}
.ctotal{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;font-size:15px;white-space:nowrap}
.ctotal small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
details.cand[open] summary .cname::after{content:" ▲";font-size:10px;color:var(--muted)}
details.cand summary .cname::after{content:" ▼";font-size:10px;color:var(--muted)}
.cbody{padding:0 2px 14px;display:grid;gap:10px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.check{background:var(--warn-bg);color:var(--warn)}
.pill.best{background:var(--ink);color:var(--surface)}
.na{display:grid;gap:4px;margin:0;padding:0;list-style:none;font-size:13px}
.na li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline}
.na li .x{color:var(--no);font-weight:700}
details.more>summary{cursor:pointer;font-weight:700;font-size:14px}
.rules{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.rules th,.rules td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.rules th{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.rules td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tests{display:grid;gap:4px;font-size:13px;margin:0;padding:0;list-style:none}
.tests li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.tests .p{color:var(--ok);font-weight:700}.tests .f{color:var(--accent);font-weight:700}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.cathead,.catrow{display:grid;grid-template-columns:5.6em minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.cathead{font-size:12px;color:var(--muted);font-weight:700}
.catrow .lab{font-size:14px}
.catlist{display:grid;gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="pins" aria-hidden="true"><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i></span>ボウリング料金・プラン提案システム</h1>
    <div class="tag">スタッフ用 ｜ 会計前の確認用 ｜ 料金表 <b id="ver"></b></div>
  </header>

  <div class="main">
    <form class="panel" id="form" autocomplete="off">
      <h2>ご利用条件</h2>
      <fieldset>
        <legend>日時</legend>
        <div class="grid2">
          <div class="field"><label for="date">利用日</label><input type="date" id="date"></div>
          <div class="field"><label for="time">開始時刻</label><input type="time" id="time" step="60"></div>
        </div>
        <label class="check"><input type="checkbox" id="sync" checked>現在の日時に合わせる（手で変えると解除）</label>
        <label class="check"><input type="checkbox" id="holiday">祝日として扱う（祝日は自動判定。臨時の場合だけチェック）</label>
        <div class="daybox" id="daybox"></div>
        <div class="field" id="svcBox" hidden>
          <label for="svcGames">サービス対象のゲーム数（1人あたり）</label>
          <select id="svcGames"></select>
          <p class="hint" id="svcHint" style="margin:0"></p>
        </div>
      </fieldset>

      <fieldset>
        <legend>人数と貸し靴（料金区分別）</legend>
        <div class="catlist">
          <div class="cathead"><span>区分</span><span>人数</span><span>うち貸し靴</span></div>
          <div id="counts" class="catlist"></div>
        </div>
        <button type="button" class="linkbtn" id="shoesAll">全員を貸し靴ありにする</button>
        <p class="hint" style="margin:0">区分が重なる人は安い区分で入力。会員の学生は「会員」で入力。</p>
      </fieldset>

      <fieldset>
        <legend>ゲーム数</legend>
        <div class="grid2" id="gs"></div>
      </fieldset>

      <fieldset>
        <legend>団体予約</legend>
        <label class="check"><input type="checkbox" id="reserved">前日までに団体予約済み</label>
        <div class="grid2" id="lanesBox"></div>
      </fieldset>

      <fieldset>
        <legend>お持ちの券（枚数）</legend>
        <div class="grid2" id="tickets"></div>
      </fieldset>

      <button type="button" class="linkbtn" id="reset">入力をリセット</button>
    </form>

    <div class="results" id="results" aria-live="polite"></div>
  </div>

  <details class="sec more">
    <summary>料金ルール一覧（原本との照合用）</summary>
    <div class="tbl"><table class="rules" id="rulesTbl"></table></div>
  </details>

  <details class="sec more">
    <summary id="testSum">検証ケース</summary>
    <ul class="tests" id="testList"></ul>
  </details>

  <footer>スタッフ用の料金確認ツールです（税込表示）。表示は会計前の目安で、最終金額はレジで確認してください。料金表を改定したときは、責任者が原本と照合してから更新してください。</footer>
</div>

<script src="rules.js"></script>
<script src="holidays.js"></script>
<script id="engine">
/* 料金ルール（CATS・RULES）は rules.js、祝日は holidays.js にあります */
const MSG={};   // 未確認ルールの警告文（現在は該当なし）

/* 祝日：holidays.js の一覧＋手動チェック */
function holidayName(date){return (typeof HOLIDAYS!=='undefined'&&HOLIDAYS[date])||'';}
function isHol(inp){return !!inp.holiday||!!holidayName(inp.date);}
function holidayDataEnds(){if(typeof HOLIDAYS==='undefined')return 0;return Math.max(...Object.keys(HOLIDAYS).map(k=>+k.slice(0,4)));}

const yen=n=>(n<0?'−':'')+Math.abs(n).toLocaleString('ja-JP')+'円';
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function mins(inp){const [h,mi]=inp.time.split(':').map(Number);return h*60+mi;}

function detectServices(inp){
  if(!inp.date||!inp.time) return [];
  const d=parseDate(inp.date),dow=d.getDay(),day=d.getDate(),t=mins(inp),hit=new Set();
  if(day===22) hit.add('fan');
  if((dow===0||isHol(inp))&&t>=480&&t<600) hit.add('early');
  if(t>=1260) hit.add('night');
  return RULES.services.filter(s=>hit.has(s.id));
}
/* 開始時はまだ対象外だが、遊んでいる途中に始まる時間帯サービス */
function detectUpcoming(inp){
  if(!inp.date||!inp.time) return [];
  const t=mins(inp),hit=new Set();
  if(t>=1140&&t<1260) hit.add('night');                          // 19:00〜20:59開始
  return RULES.services.filter(s=>hit.has(s.id));
}
/* サービス対象のゲーム数（1人あたり）。未指定なら：開始時に対象内→全ゲーム、対象外→0 */
function serviceGames(inp,g,active){
  const v=inp.svcGames;
  if(v==null||v==='') return active.length?g:0;
  return Math.min(g,Math.max(0,v|0));
}

/* 1人分のパック：5・10ゲームパックの組合せ＋足りない分は通常料金 */
function packBest(cat,g){
  const p5=RULES.pack5.price[cat],p10=RULES.pack10.price[cat],np=RULES.normal[cat];
  let best=null;
  for(let a=0;a<=(p10==null?0:Math.ceil(g/10));a++)for(let b=0;b<=(p5==null?0:Math.ceil(g/5));b++){
    if(a+b===0)continue;
    const games=10*a+5*b,packCost=a*(p10||0)+b*(p5||0),rest=Math.max(0,g-games),cost=packCost+rest*np;
    if(!best||cost<best.cost||(cost===best.cost&&games+rest<best.games+best.rest))best={cost,packCost,n10:a,n5:b,games,rest,np};
  }
  return best;
}
function packName(o){const s=[];if(o.n10)s.push('10ゲームパック×'+o.n10);if(o.n5)s.push('5ゲームパック×'+o.n5);return s.join('＋')+(o.rest?`＋通常${o.rest}ゲーム`:'');}

function mk(id,name,lines,checks,notes){
  const ch=[...new Set(checks)];
  return {id,name,lines,checks:ch,notes:[...new Set(notes)],total:lines.reduce((s,l)=>s+l.amount,0),status:ch.length?'check':'ok'};
}
function topFree(pg,cap){return [...pg].sort((a,b)=>b-a).slice(0,cap).reduce((x,p)=>x+p,0);}

/* 券1種類の効果。使えない場合は {na:理由} */
function ticketEffect(type,ctx){
  const T=RULES.tickets[type],t=ctx.tickets[type]||0;
  if(type==='oneGame'){
    if(ctx.g<T.minGames) return {na:`${T.name}：2ゲーム以上の利用が条件です（希望${ctx.g}ゲーム）`};
    const cap=Math.min(ctx.n,T.perTicket*t),used=Math.ceil(cap/T.perTicket),notes=[];
    if(t>used)notes.push(`${T.name}は${used}枚で足ります（入力${t}枚）`);
    if(ctx.n>cap)notes.push(`${T.name}：${ctx.n-cap}名は対象外（あと${Math.ceil((ctx.n-cap)/T.perTicket)}枚で全員が対象）`);
    return {line:{label:`${T.name} ${used}枚`,detail:`${cap}名 × 1ゲーム無料`,amount:-topFree(ctx.pg,cap)},checks:[],notes};
  }
  if(type==='familyDay'){
    if(ctx.counts.child===0) return {na:`${T.name}：高校生以上のみのグループでは使えません（中学生以下0名）`};
    const cap=Math.min(ctx.n,T.perTicket*t),used=Math.ceil(cap/T.perTicket),notes=[];
    if(t>used)notes.push(`${T.name}は${used}枚で足ります（入力${t}枚）`);
    if(ctx.n>cap)notes.push(`${T.name}：${ctx.n-cap}名は対象外`);
    return {line:{label:`${T.name} ${used}枚`,detail:`${cap}名 × 1ゲーム無料`,amount:-topFree(ctx.pg,cap)},checks:[],notes};
  }
  if(type==='shoe'){
    if(ctx.shoes===0) return {na:`${T.name}：貸し靴の利用がありません`};
    const k=Math.min(ctx.shoes,t),notes=[];
    if(t>k)notes.push(`${T.name}は${k}枚で足ります（入力${t}枚）`);
    return {line:{label:`${T.name} ${k}枚`,detail:`貸し靴 ${k}名分`,amount:-RULES.shoes*k},checks:[],notes};
  }
  if(type==='invite'){
    if(ctx.counts.member===0) return {na:`${T.name}：会員限定です（会員0名）`};
    const k=Math.min(ctx.counts.member,t),notes=[];
    if(t>k)notes.push(`${T.name}：会員${ctx.counts.member}名のため${k}枚で計算`);
    return {line:{label:`${T.name} ${k}枚`,detail:`会員 ${k}名 × 1ゲーム無料`,amount:-ctx.memberPrice*k},checks:[],notes};
  }
}
/* ベース案に券を当てた派生案を作る */
function ticketVariants(base,types,ctx,out,extraCheck){
  const eff=[];
  for(const t of types.filter(t=>(ctx.tickets[t]||0)>0)){const e=ticketEffect(t,ctx);if(e.na){out.na.add(e.na);continue;}eff.push([t,e]);}
  const ex=extraCheck?[extraCheck]:[];
  const make=(list,checks)=>mk(base.id+'+'+(list.length>1?'multi':list[0][0]),
    base.name+'＋'+list.map(([t])=>RULES.tickets[t].name).join('＋'),
    [...base.lines,...list.map(([,e])=>e.line)],
    [...base.checks,...list.flatMap(([,e])=>e.checks),...checks],
    [...base.notes,...list.flatMap(([,e])=>e.notes)]);
  eff.forEach(x=>out.candidates.push(make([x],ex)));
  if(eff.length>=2)out.na.add(`無料券・サービスは併用できません。${eff.map(([t])=>RULES.tickets[t].name).join('・')}のうち、最も安くなる1種類だけを使います`);
}

function quote(inp){
  const g=inp.games|0,counts={},shoesBy={},tickets=inp.tickets||{},warnings=[];
  CATS.forEach(c=>{
    counts[c.id]=Math.max(0,(inp.counts||{})[c.id]|0);
    const s=Math.max(0,(inp.shoes||{})[c.id]|0);
    if(s>counts[c.id])warnings.push(`${c.label}の貸し靴が人数を超えているため、${counts[c.id]}名で計算しています`);
    shoesBy[c.id]=Math.min(s,counts[c.id]);
  });
  const n=CATS.reduce((s,c)=>s+counts[c.id],0),shoes=CATS.reduce((s,c)=>s+shoesBy[c.id],0);
  const services=detectServices(inp);
  if(inp.date&&inp.time){const d=parseDate(inp.date),hol=d.getDay()===0||isHol(inp),[o,c]=hol?RULES.hours.holiday:RULES.hours.weekday,t=mins(inp);
    if(t<o||t>=c)warnings.push(`開始時刻が営業時間外です（${hol?'日曜・祝日 8:00':'10:00'}〜23:00）`);}
  if(inp.date&&+inp.date.slice(0,4)>holidayDataEnds())warnings.push(`祝日データは${holidayDataEnds()}年分までです。祝日の場合は「祝日として扱う」にチェックを入れてください（holidays.js に翌年分の追加が必要）`);
  const out={n,g,services,upcoming:detectUpcoming(inp),candidates:[],na:new Set(),warnings};
  if(n===0||g<1){out.empty=true;return finish(out);}
  const shoeLine=k=>k?[{label:'貸し靴',detail:`${yen(RULES.shoes)} × ${k}名`,amount:RULES.shoes*k}]:[];
  const used=CATS.filter(c=>counts[c.id]>0);
  const heldNames=types=>types.filter(t=>(tickets[t]||0)>0).map(t=>RULES.tickets[t].name);
  const normLine=(c,games,k,suffix)=>({label:`${c.label} 通常料金${suffix||''}`,detail:`${yen(RULES.normal[c.id])} × ${games}ゲーム × ${k}名`,amount:RULES.normal[c.id]*games*k});

  /* A. 通常料金 */
  const pg=[];
  used.forEach(c=>{for(let i=0;i<counts[c.id];i++)pg.push(RULES.normal[c.id]);});
  const A=mk('normal','通常料金',[...used.map(c=>normLine(c,g,counts[c.id])),...shoeLine(shoes)],[],[]);
  out.candidates.push(A);
  ticketVariants(A,['oneGame','familyDay','shoe','invite'],{g,n,shoes,counts,tickets,pg,memberPrice:RULES.normal.member},out);

  /* B. 5・10ゲームパック（足りない分は通常料金。パックは1人ずつ） */
  const bL=[],bN=['パックは1人ずつ購入します（グループで分け合うことはできません）'];
  let anyPack=false;
  used.forEach(c=>{
    const k=counts[c.id],nCost=RULES.normal[c.id]*g,b=packBest(c.id,g);
    if(b&&b.cost<nCost){
      anyPack=true;
      bL.push({label:`${c.label} ${packName(b)}`,detail:b.rest?`（${yen(b.packCost)}＋${yen(b.np)}×${b.rest}）× ${k}名`:`${yen(b.cost)} × ${k}名`,amount:b.cost*k});
      if(b.games>g)bN.push(`${c.label}：パックで計${b.games}ゲーム遊べます（希望より${b.games-g}ゲーム多い）`);
      bN.push('途中でやめた場合は、実際に遊んだゲーム数を入力し直して再計算してください');
    }else bL.push(normLine(c,g,k));
  });
  if(anyPack){
    const na=heldNames(['oneGame','familyDay','invite']);
    if(na.length)bN.push(`パック利用時は${na.join('・')}は使えません`);
    const B=mk('pack','5・10ゲームパック',[...bL,...shoeLine(shoes)],[],bN);
    out.candidates.push(B);
    ticketVariants(B,['shoe'],{g,n,shoes,counts,tickets,pg:[],memberPrice:0},out);
  }else out.na.add(`5・10ゲームパック：希望${g}ゲームでは通常料金の方が安くなります`);

  /* C. 時間帯サービス（全区分一律。境目を過ぎてから開始したゲームだけに適用） */
  const pool=services.length?services:out.upcoming,sg=serviceGames(inp,g,services);
  out.svcGames=sg;
  if(pool.length&&sg>0){
    const svc=pool.reduce((a,b)=>b.price<a.price?b:a),rest=g-sg;
    const cN=[`${svc.name}：${svc.cond}。境目を過ぎてから開始したゲームに適用（1人あたり${sg}/${g}ゲーム）`];
    if(pool.length>1)cN.push(`${pool.map(s=>s.name).join('・')}が重なっているため、最も安い${svc.name}を適用`);
    const na=heldNames(['oneGame','familyDay','shoe']);
    if(na.length)cN.push(`時間帯サービス中は${na.join('・')}は使えません`);
    const cL=[{label:`${svc.name}（全員）`,detail:`${yen(svc.price)} × ${sg}ゲーム × ${n}名`,amount:svc.price*sg*n}];
    if(rest>0)used.forEach(c=>cL.push(normLine(c,rest,counts[c.id],'（時間外）')));
    const C=mk('service',rest>0?`${svc.name} ${sg}ゲーム＋通常${rest}ゲーム`:svc.name,[...cL,...shoeLine(shoes)],[],cN);
    out.candidates.push(C);
    ticketVariants(C,['invite'],{g,n,shoes,counts,tickets,pg:[],memberPrice:rest>0?Math.max(RULES.normal.member,svc.price):svc.price},out);
  }else if(pool.length){
    out.na.add(`${pool.map(s=>s.name).join('・')}：サービス対象のゲーム数が0です（境目をまたぐ場合は「サービス対象のゲーム数」を選択）`);
  }else out.na.add('時間帯サービス：該当なし（ナイト 21:00以降／早朝 日祝8:00〜10:00／感謝Day 毎月22日）');

  /* D. ファミリーパック（一部の人だけに適用可） */
  const F=RULES.family,adults=counts.general+counts.member+counts.student,eWhy=[];
  if(g!==F.games)eWhy.push(`2ゲーム専用（希望${g}ゲーム）`);
  if(counts.child<1)eWhy.push('中学生以下が0名');
  if(adults<1)eWhy.push('保護者（大人）が0名');
  if(eWhy.length)out.na.add('ファミリーパック：'+eWhy.join('、'));
  else{
    // 1人ずつ「ファミリーパック」と「通常2ゲーム（＋貸し靴）」を比べ、得する人に適用
    const grp=[];
    used.forEach(c=>{const k=counts[c.id],s=shoesBy[c.id];
      [[true,s],[false,k-s]].forEach(([shoe,m])=>{if(m>0){const alt=RULES.normal[c.id]*g+(shoe?RULES.shoes:0);grp.push({cat:c.id,shoe,count:m,delta:F.price-alt,take:0});}});});
    grp.forEach(x=>{if(x.delta<0)x.take=x.count;});
    const has=p=>grp.some(x=>x.take>0&&p(x));
    const force=p=>{if(has(p))return true;const x=grp.filter(y=>p(y)&&y.take<y.count).sort((a,b)=>a.delta-b.delta||(b.shoe-a.shoe))[0];if(x){x.take++;return true;}return false;};
    force(x=>x.cat==='child');
    const gm=x=>x.cat==='general'||x.cat==='member';
    if(!has(x=>x.cat!=='child')){if(!force(gm))force(x=>x.cat==='student');}   // 保護者は一般・会員を優先、いなければ学生
    const famN=grp.reduce((s,x)=>s+x.take,0),dL=[{label:'ファミリーパック（2ゲーム＋貸し靴）',detail:`${yen(F.price)} × ${famN}名`,amount:F.price*famN}];
    const dN=['中学生以下と保護者（学生も可）が各1名以上いることを受付で確認してください'],dC=[];
    if(famN<n){
      used.forEach(c=>{const r=counts[c.id]-grp.filter(x=>x.cat===c.id).reduce((s,x)=>s+x.take,0);if(r>0)dL.push(normLine(c,g,r));});
      const restShoes=grp.filter(x=>x.shoe).reduce((s,x)=>s+x.count-x.take,0);
      dL.push(...shoeLine(restShoes));
      dN.push(`ファミリーパックは${famN}名に適用。残り${n-famN}名は通常料金の方が安いため通常料金で計算`);
    }
    const na=heldNames(['oneGame','familyDay','shoe']);if(na.length)dN.push(`この案では${na.join('・')}は当てていません`);
    out.candidates.push(mk('family',famN<n?`ファミリーパック${famN}名＋通常料金`:'ファミリーパック',dL,dC,dN));
  }

  /* E. 団体予約（4ゲーム以上は別プラン） */
  const G=RULES.group,gp=G.price[g],fWhy=[];
  if(n<G.minPeople)fWhy.push(`10名以上が条件（${n}名）`);
  if(!inp.reserved)fWhy.push('前日までの予約なし');
  if((inp.lanes|0)<G.minLanes)fWhy.push(`5レーン以上が条件（${inp.lanes|0}レーン）`);
  if(!gp)fWhy.push(`2ゲームか3ゲームのみ（希望${g}ゲームは他のプランで計算）`);
  if(fWhy.length){if(n>=G.minPeople||inp.reserved)out.na.add('団体予約パック：'+fWhy.join('、'));}
  else{
    const fN=['貸し靴付きの料金です'],na=heldNames(['oneGame','familyDay','shoe']);
    if(na.length)fN.push(`団体予約パックでは${na.join('・')}は使えません`);
    out.candidates.push(mk('group',`団体予約パック（${g}ゲーム）`,[{label:`団体予約 ${g}ゲーム（貸し靴付）`,detail:`${yen(gp)} × ${n}名`,amount:gp*n}],[],fN));
  }
  return finish(out);
}
function finish(out){
  out.na=[...out.na];
  out.candidates.sort((a,b)=>a.total-b.total||(a.status==='ok'?-1:1));
  out.bestOk=out.candidates.find(c=>c.status==='ok')||null;
  out.bestAny=out.candidates[0]||null;
  return out;
}

function runTests(){
  return TESTS.map(t=>{
    const inp=Object.assign({},BASE,t.inp);
    const q=quote(inp),e=t.exp,errs=[],find=id=>q.candidates.find(c=>c.id===id);
    if(e.bestOk&&!(q.bestOk&&q.bestOk.id===e.bestOk[0]&&q.bestOk.total===e.bestOk[1]))errs.push(`確定最安 期待:${e.bestOk} 実際:${q.bestOk?q.bestOk.id+','+q.bestOk.total:'なし'}`);
    if(e.bestAny&&!(q.bestAny&&q.bestAny.id===e.bestAny[0]&&q.bestAny.total===e.bestAny[1]))errs.push(`全体最安 期待:${e.bestAny} 実際:${q.bestAny?q.bestAny.id+','+q.bestAny.total:'なし'}`);
    (e.has||[]).forEach(([id,v])=>{const c=find(id);if(!c||c.total!==v)errs.push(`${id}=${v}がない（実際:${c?c.total:'なし'}）`);});
    (e.not||[]).forEach(id=>{if(find(id))errs.push(`${id}が出ている`);});
    if(e.warn!=null&&e.warn!==q.warnings.some(w=>w.includes('営業時間外')))errs.push(`営業時間外の警告 期待:${e.warn}`);
    if(e.svc&&e.svc.join()!==q.services.map(s=>s.id).join())errs.push(`サービス 期待:${e.svc} 実際:${q.services.map(s=>s.id)}`);
    return {name:t.name,pass:!errs.length,errs};
  });
}
if(typeof module!=='undefined')module.exports={quote,runTests,RULES};

/* 現在の日本時間を 'YYYY-MM-DD' と 'HH:MM' で返す（端末の設定に関係なく日本時間） */
function nowJST(){
  const p={};new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
    .formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
  return {date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour}:${p.minute}`};
}
/* 同期中なら日付・時刻を現在に合わせる。変わったときだけ再計算 */
function syncClock(){
  if(!$('#sync').checked)return false;
  const n=nowJST();
  if($('#date').value===n.date&&$('#time').value===n.time)return false;
  $('#date').value=n.date;$('#time').value=n.time;return true;
}
const SAMPLE={counts:{},shoes:{},games:2};
function setForm(s){
  $('#sync').checked=true;syncClock();$('#holiday').checked=false;$('#reserved').checked=false;
  CATS.forEach(c=>{$('#c_'+c.id).value=(s.counts||{})[c.id]||0;$('#s_'+c.id).value=(s.shoes||{})[c.id]||0;});
  $('#games').value=s.games;$('#lanes').value=0;$('#svcGames').value='';
  Object.keys(RULES.tickets).forEach(k=>$('#t_'+k).value=0);
}
function num(id){const v=parseInt($('#'+id).value,10);return isNaN(v)?0:Math.max(0,v);}
function readInput(){
  const counts={},shoes={},tickets={};
  CATS.forEach(c=>{counts[c.id]=num('c_'+c.id);shoes[c.id]=num('s_'+c.id);});
  Object.keys(RULES.tickets).forEach(k=>tickets[k]=num('t_'+k));
  const sv=$('#svcBox').hidden?'':$('#svcGames').value;
  return {date:$('#date').value,time:$('#time').value,holiday:$('#holiday').checked,svcGames:sv===''?null:Number(sv),games:num('games'),reserved:$('#reserved').checked,lanes:num('lanes'),counts,shoes,tickets};
}
const pill=c=>c.status==='ok'?'<span class="pill ok">確定</span>':'<span class="pill check">要確認</span>';
function bdTable(c){
  return `<div class="tbl"><table class="bd">${c.lines.map(l=>`<tr class="${l.amount<0?'minus':''}"><td>${l.label}</td><td class="d">${l.detail}</td><td class="a">${yen(l.amount)}</td></tr>`).join('')}<tr class="sum"><td>合計</td><td class="d"></td><td class="a">${yen(c.total)}</td></tr></table></div>`;
}
function lists(c){
  return (c.checks.length?`<ul class="list checks">${c.checks.map(x=>`<li><b>要確認：</b>${x}</li>`).join('')}</ul>`:'')+
         (c.notes.length?`<ul class="list notes">${c.notes.map(x=>`<li>${x}</li>`).join('')}</ul>`:'');
}
/* 境目をまたぐ可能性があるときだけ「サービス対象のゲーム数」を出す */
function syncSvcBox(){
  const base={date:$('#date').value,time:$('#time').value,holiday:$('#holiday').checked};
  const act=detectServices(base),up=act.length?[]:detectUpcoming(base);
  const crossable=act.filter(s=>s.id!=='fan');   // 感謝Dayは終日なので、またぎなし
  const box=$('#svcBox'),sel=$('#svcGames'),g=num('games');
  box.hidden=!(crossable.length||up.length);
  if(box.hidden)return;
  const cur=sel.value,auto=act.length?g:0;
  sel.innerHTML=`<option value="">自動（${auto}ゲーム）</option>`+Array.from({length:g+1},(_,i)=>`<option value="${i}">${i}ゲーム</option>`).join('');
  sel.value=cur!==''&&Number(cur)<=g?cur:'';
  if(up.some(s=>s.id==='night'))$('#svcHint').textContent='21:00を過ぎてから開始するゲーム数を選んでください。そのゲームだけナイト料金、残りは通常料金で計算します。';
  else if(crossable.some(s=>s.id==='early'))$('#svcHint').textContent='10:00より前に開始するゲーム数を選んでください。10:00以降に開始するゲームは通常料金で計算します。';
  else $('#svcHint').textContent='サービス時間内の開始です。自動では全ゲームにサービス料金を適用します。';
}
function render(){
  syncSvcBox();
  const inp=readInput(),q=quote(inp);
  let day='';
  if(inp.date){const d=parseDate(inp.date);const hn=holidayName(inp.date);day=`${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}${(hn||inp.holiday)&&d.getDay()!==0?'・祝':''}）${hn?' '+hn:''}`;}
  $('#daybox').innerHTML=`<span>${day}</span>`+RULES.services.map(s=>{const on=q.services.some(x=>x.id===s.id),soon=!on&&q.upcoming.some(x=>x.id===s.id);
    return `<span class="chip ${on?'on':soon?'soon':''}" title="${s.cond}">${s.name}${soon?'（途中から）':''}</span>`;}).join('');
  let h='';
  if(q.empty){
    h=`<div class="rec"><div class="empty">人数とゲーム数を入力すると、使える料金候補と内訳を表示します。</div></div>`;
  }else{
    q.warnings.forEach(w=>h+=`<div class="callout"><span>${w}</span></div>`);
    const ok=q.bestOk,any=q.bestAny;
    if(ok){
      h+=`<section class="rec"><div class="eyebrow">ご提案 ｜ 確定ルールの範囲で最安</div><div class="name">${ok.name}</div>
      <div class="price">${ok.total.toLocaleString('ja-JP')}<small>円（税込）</small></div>
      <div class="per">${q.n}名・${q.g}ゲーム ｜ 1人あたり 約${Math.round(ok.total/q.n).toLocaleString('ja-JP')}円</div>
      ${bdTable(ok)}${lists(ok)}</section>`;
    }else{
      h+=`<section class="rec"><div class="eyebrow" style="color:var(--warn)">確定できる候補がありません</div><div class="per">どの候補も未確認のルールに依存しています。下の候補を責任者に確認してください。</div></section>`;
    }
    if(any&&any.status==='check'&&(!ok||any.total<ok.total)){
      h+=`<div class="callout"><b class="t">確認できればさらに安い候補：${any.name} ${yen(any.total)}${ok?`（${yen(ok.total-any.total)}安い）`:''}</b>
      <ul class="list checks">${any.checks.map(x=>`<li>${x}</li>`).join('')}</ul><span class="hint">未確認のルールに依存するため「最安」とはしていません。</span></div>`;
    }
    h+=`<section class="sec"><h3>候補の比較 <span>${q.candidates.length}件・安い順。タップで内訳</span></h3><div class="cands">`+
      q.candidates.map(c=>{const diff=ok&&c!==ok?c.total-ok.total:null;
        return `<details class="cand"><summary>${c===ok?'<span class="pill best">提案</span>':pill(c)}<span class="cname">${c.name}</span><span class="ctotal">${yen(c.total)}${diff!==null?`<small>${diff>0?'+':''}${yen(diff)}</small>`:''}</span></summary><div class="cbody">${bdTable(c)}${lists(c)}</div></details>`;}).join('')+`</div></section>`;
    if(q.na.length)h+=`<section class="sec"><h3>使えない・候補外</h3><ul class="na">${q.na.map(x=>`<li><span class="x">×</span><span>${x}</span></li>`).join('')}</ul></section>`;
  }
  $('#results').innerHTML=h;
}
const R=RULES,cell=v=>v==null?'<b style="color:var(--warn)">記載なし</b>':yen(v);
const per=p=>`一般 ${cell(p.general)}／学生 ${cell(p.student)}／中学生以下 ${cell(p.child)}／会員 ${cell(p.member)}`;
const rows=[
  ['料金表の版',R.version,'rules.js を書き換えたら更新'],
  ['通常（1ゲーム）',per(R.normal),'学生は一般と同額'],
  ['貸し靴',cell(R.shoes),''],
  ['5ゲームパック',per(R.pack5.price),'貸し靴別。1人ずつ購入（分け合い不可）。不足分は通常料金で追加可'],
  ['10ゲームパック',per(R.pack10.price),'中学生以下は学生と同額。条件は5ゲームパックと同じ'],
  ...R.services.map(s=>[s.name,`1ゲーム ${cell(s.price)}（全区分一律）`,`${s.cond}。境目を過ぎてから開始したゲームに適用。重なれば最安を適用`]),
  ['ファミリーパック',`2ゲーム＋貸し靴 1人 ${cell(R.family.price)}`,'中学生以下と保護者（学生も可）が各1名以上。グループの一部だけに適用可'],
  ['団体予約',`2ゲーム ${cell(R.group.price[2])}／3ゲーム ${cell(R.group.price[3])}（貸し靴付・1人）`,'10名以上・前日までの予約・5レーン以上。4ゲーム以上は他プラン'],
  ['一ゲーム無料券','1枚で最大6名×1ゲーム','2ゲーム以上。パック・サービスと併用不可'],
  ['貸し靴無料券','1枚で1名分','団体・ファミリーパック・サービスと併用不可。5・10パックとは併用可'],
  ['家庭の日無料券','1枚で最大5名×1ゲーム','日付の制限なし。サービス併用不可。高校生以上のみは不可'],
  ['無料招待券','1枚＝会員1名×1ゲーム','時間帯サービス中も可。5・10パックとは併用不可'],
  ['併用の原則','—','無料券・サービスは基本的に併用不可で、条件のよい方を優先。例外：パック＋貸し靴無料券、時間帯サービス＋無料招待券'],
  ['途中でやめた場合','—','実際に遊んだゲーム数で再計算する'],
  ['営業時間','平日・土曜 10:00〜23:00／日曜・祝日 8:00〜23:00','営業時間外の開始時刻は警告を表示'],
  ['適用除外日','—','年末年始・貸切日などの扱いは保留中（未反映）']
];
$('#rulesTbl').innerHTML='<tr><th>項目</th><th>料金・内容（税込）</th><th>条件・未確認事項</th></tr>'+rows.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td>${r[2]}</td></tr>`).join('');
const res=runTests(),pass=res.filter(r=>r.pass).length;
$('#testSum').textContent=`検証ケース（${pass}/${res.length} 件合格）`;
$('#testList').innerHTML=res.map(r=>`<li><span class="${r.pass?'p':'f'}">${r.pass?'○':'×'}</span><span>${r.name}${r.errs.length?'<br><span class="hint">'+r.errs.join(' / ')+'</span>':''}</span></li>`).join('');

$('#form').addEventListener('input',e=>{if(e.target.id==='date'||e.target.id==='time')$('#sync').checked=false;render();});
$('#form').addEventListener('change',e=>{if(e.target.id==='sync')syncClock();render();});
setInterval(()=>{if(syncClock())render();},15000);   // 15秒ごとに時計を確認
$('#form').addEventListener('submit',e=>e.preventDefault());
$('#form').addEventListener('click',e=>{
  const b=e.target.closest('button[data-for]');if(!b)return;
  const inp=$('#'+b.dataset.for),v=(parseInt(inp.value,10)||0)+Number(b.dataset.d);
  inp.value=Math.min(Number(inp.max),Math.max(0,v));render();
});
$('#shoesAll').addEventListener('click',()=>{CATS.forEach(c=>$('#s_'+c.id).value=num('c_'+c.id));render();});
$('#reset').addEventListener('click',()=>{setForm(SAMPLE);render();});
$('#ver').textContent=RULES.version;
setForm(SAMPLE);render();
})();
</script>
</body>
</html>
